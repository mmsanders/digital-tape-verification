      - name: Human564 partial-evidence attribution controls (ZERO Product or UI execution)
        run: python3 -B tests/windows_human_flow_r1/contract.py
      - name: Correct Windows selection constant and Unicode summary (ZERO Product or browser execution)
        run: |
          python3 -B tests/windows_interactions_r2/contract.py
          python3 -B tests/windows_interactions_r2/compatibility.py
          python3 -B tests/windows_interactions_r2/summary.py
          python3 -B findings/P2-324-PLATFORM-CI-2026-10-25/review.py
      - name: Final Software584 original-record replay (ZERO Product or browser execution)
        run: python3 -B findings/P2-324-FINAL-2026-10-26/review.py
      - name: Editing/details/concurrent ordering obligations (ZERO Product or DOM execution)
        run: python3 -B tests/windows_interactions_r1/contract.py
      - name: Additive discovery candidate expectations (ZERO build or Product execution)
        run: python3 -B tests/windows_discovery_candidate_r1/contract.py
      - name: Native-flow prerequisite evidence controls (ZERO UI execution)
        run: python3 -B tests/windows_native_flow_r1/contract.py
      - name: Discovery integration controls (ZERO device execution)
        run: python3 -B tests/windows_discovery_r1/contract.py
      - name: Software578 retained evidence and scoped findings (ZERO Product execution)
        run: python3 -B findings/P2-318-RETURN-2026-10-25/review.py
      - name: Software578 correction retained authentication (ZERO Product execution)
        run: python3 -B findings/P2-318-CORRECTION1-2026-10-25/review.py
      - name: Corrected production renderer over retained views (logical test DOM only)
        run: node findings/P2-318-CORRECTION1-2026-10-25/render.mjs
      - name: Software578 live-1 retained originals (ZERO child/device execution)
        run: python3 -B findings/P2-318-LIVE1-2026-10-25/review.py
