        run: python3 -B findings/P2-352-SOURCE-2026-10-28/audit.py --self-check
      - name: PM611 cards-1 receipt and new612 budget controls (ZERO Product execution)
        run: |
          python3 -B tests/windows_cards_receipts_r1/controls.py
          python3 -B tests/windows_cards_receipts_r1/candidate.py
      - name: Verification338 scoped console result controls (ZERO Product/process execution)
        run: python3 -B findings/P2-338-CONSOLE-2026-10-27/verify.py
      - name: Software594 correction1 retained originals (ZERO Product/process execution)
        run: python3 -B findings/P2-332-CORRECTION1-2026-10-27/replay.py
      - name: Software598 exact disposition and594 original-record replay (ZERO Product/process execution)
        run: |
          python3 -B tests/windows_diagnostics_r2/regressions.py
          python3 -B tests/windows_diagnostics_r2/cases.py
          python3 -B findings/P2-332-333-REVIEW-2026-10-26/replay.py
      - name: Diagnostic receipt and clean INGEST extraction controls (ZERO Product/process/dispatch execution)
