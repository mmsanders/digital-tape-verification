name: Production app component expectations
on:
  pull_request:
    paths: ['tests/windows_interactions_r2/**', 'findings/P2-324-*/**', 'tests/windows_interactions_r1/**', 'tests/windows_discovery_candidate_r1/**', 'tests/windows_screen_r1/**', 'tests/windows_bridge_r1/**', 'tests/windows_candidate_r1/**', 'tests/windows_native_flow_r1/**', 'tests/windows_discovery_r1/**', 'findings/P2-318-*/**', 'findings/P2-317-*/**', 'findings/P2-305-*/**', 'findings/P2-306-*/**', 'findings/P2-307-*/**', '.github/workflows/verifier-production-app.yml']
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct Windows selection constant and Unicode summary (ZERO Product or browser execution)
        run: |
          python3 -B tests/windows_interactions_r2/contract.py
          python3 -B tests/windows_interactions_r2/compatibility.py
          python3 -B tests/windows_interactions_r2/summary.py
          python3 -B findings/P2-324-PLATFORM-CI-2026-10-25/review.py
      - name: Final Software584 original-record replay (ZERO Product or browser execution)
        run: python3 -B findings/P2-324-FINAL-2026-10-26/review.py
      - name: Editing/details/concurrent ordering obligations (ZERO Product or DOM execution)
        run: python3 -B tests/windows_interactions_r1/contract.py
      - name: Additive discovery candidate expectations (ZERO build or Product execution)
        run: python3 -B tests/windows_discovery_candidate_r1/contract.py
      - name: Native-flow prerequisite evidence controls (ZERO UI execution)
        run: python3 -B tests/windows_native_flow_r1/contract.py
      - name: Discovery integration controls (ZERO device execution)
        run: python3 -B tests/windows_discovery_r1/contract.py
      - name: Software578 retained evidence and scoped findings (ZERO Product execution)
        run: python3 -B findings/P2-318-RETURN-2026-10-25/review.py
      - name: Software578 correction retained authentication (ZERO Product execution)
        run: python3 -B findings/P2-318-CORRECTION1-2026-10-25/review.py
      - name: Corrected production renderer over retained views (logical test DOM only)
        run: node findings/P2-318-CORRECTION1-2026-10-25/render.mjs
      - name: Software578 live-1 retained originals (ZERO child/device execution)
        run: python3 -B findings/P2-318-LIVE1-2026-10-25/review.py
      - name: Screen causal controls (ZERO Product execution)
        run: python3 -B tests/windows_screen_r1/contract.py
      - name: Bridge causal controls (ZERO Product execution)
        run: python3 -B tests/windows_bridge_r1/contract.py
      - name: Exact optional frame projection controls (ZERO Product execution)
        run: python3 -B tests/windows_bridge_r1/frames.py
      - name: Claude approval attribution controls (ZERO Product execution)
        run: python3 -B tests/windows_candidate_r1/claude.py
      - name: Candidate preparation controls (ZERO Product execution)
        run: python3 -B tests/windows_candidate_r1/prepare.py
  window-controls:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Inherited pure readiness/quit controls and C# compile (ZERO Win32 calls)
        shell: pwsh
        run: tests/windows_app_start_r2/controls.ps1
      - name: New manifest/receipt causal controls (ZERO Win32 calls)
        shell: pwsh
        run: tests/windows_candidate_r1/controls.ps1
      - name: Claude exact-command receipt controls (ZERO Win32 calls)
        shell: pwsh
        run: tests/windows_candidate_r1/claude-controls.ps1
