name: Production app component expectations
on:
  pull_request:
    paths: ['tests/windows_screen_r1/**', 'tests/windows_bridge_r1/**', 'tests/windows_candidate_r1/**', 'findings/P2-305-*/**', 'findings/P2-306-*/**', 'findings/P2-307-*/**', '.github/workflows/verifier-production-app.yml']
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Screen causal controls (ZERO Product execution)
        run: python3 -B tests/windows_screen_r1/contract.py
      - name: Bridge causal controls (ZERO Product execution)
        run: python3 -B tests/windows_bridge_r1/contract.py
      - name: Exact optional frame projection controls (ZERO Product execution)
        run: python3 -B tests/windows_bridge_r1/frames.py
      - name: Claude approval attribution controls (ZERO Product execution)
        run: python3 -B tests/windows_candidate_r1/claude.py
      - name: Candidate preparation controls (ZERO Product execution)
        run: python3 -B tests/windows_candidate_r1/prepare.py
  window-controls:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Inherited pure readiness/quit controls and C# compile (ZERO Win32 calls)
        shell: pwsh
        run: tests/windows_app_start_r2/controls.ps1
      - name: New manifest/receipt causal controls (ZERO Win32 calls)
        shell: pwsh
        run: tests/windows_candidate_r1/controls.ps1
      - name: Claude exact-command receipt controls (ZERO Win32 calls)
        shell: pwsh
        run: tests/windows_candidate_r1/claude-controls.ps1
