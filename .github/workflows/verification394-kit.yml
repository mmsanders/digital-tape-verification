name: Verification394 corrected BE1 kit
on:
  pull_request:
    paths: ['findings/V394-KIT/**', '.github/workflows/verification394-kit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kit-scopes-and-findings:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mmsanders/Digital-Tape
          ref: 0db6ce5c58f2c389499d511ef84074e99deef2ce
          path: build/software388
          sparse-checkout: firmware/bench/tools
      - name: Qualify unchanged independent harnesses and controls
        run: |
          python3 -B tests/be1_binding_r1/run.py --selftest --golden tests/golden --out build/controls-r1
          python3 -B tests/be1_binding_r1/capture.py --selftest --out build/capture-controls-r1
          python3 -B tests/be1_if3_r1/run.py --selftest --golden tests/golden --out build/controls-if3
          python3 -B tests/be1_if3_r1/capture.py --selftest --out build/capture-controls-if3
      - name: Published covered behavior on exact kit head
        run: |
          python3 -B tests/be1_binding_r1/run.py --checker build/software388/firmware/bench/tools/bench_evidence.py --golden tests/golden --out build/checker-r1
          python3 -B tests/be1_binding_r1/capture.py --helper build/software388/firmware/bench/tools/bench_capture.py --out build/capture-r1
          python3 -B tests/be1_if3_r1/run.py --checker build/software388/firmware/bench/tools/bench_evidence.py --golden tests/golden --out build/checker-if3
          python3 -B tests/be1_if3_r1/capture.py --helper build/software388/firmware/bench/tools/bench_capture.py --out build/capture-if3
      - name: Corrected strict review cases
        run: |
          python3 -B tests/be1_review_r1/run.py --checker build/software388/firmware/bench/tools/bench_evidence.py --helper build/software388/firmware/bench/tools/bench_capture.py --golden tests/golden --out build/new-findings
      - uses: actions/checkout@v4
        with:
          repository: mmsanders/Digital-Tape
          ref: d62e0de07c81dc5abe1c8ffbf378bd077a2a7eab
          path: build/original
          sparse-checkout: firmware/bench/tools
      - name: Original held pair remains a detecting historical control
        run: python3 -B tests/be1_review_r1/run.py --checker build/original/firmware/bench/tools/bench_evidence.py --helper build/original/firmware/bench/tools/bench_capture.py --golden tests/golden --record-known-findings --out build/original-findings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V394-kit-evidence
          path: build/**/RESULT.json
          retention-days: 90
