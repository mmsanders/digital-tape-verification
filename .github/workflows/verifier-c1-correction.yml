name: C1 correction exact evidence replay
on:
  pull_request:
    paths: ['findings/P2-364-CORRECTION1-2026-10-28/**', 'tests/c1_closeout_r1/**', '.github/workflows/verifier-c1-correction.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B tests/c1_closeout_r1/controls.py
      - run: python3 -B findings/P2-364-CORRECTION1-2026-10-28/fetch.py /tmp/correction-inputs
      - run: python3 -B findings/P2-364-CORRECTION1-2026-10-28/audit.py /tmp/correction-inputs --out /tmp/review.json
      - uses: actions/upload-artifact@v4
        with:
          name: c1-correction-review
          path: /tmp/review.json
