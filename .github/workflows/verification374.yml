name: Verification374 Phase3 independent package
on:
  pull_request:
    paths: ['tests/p3_r1_r374/**', 'findings/P3-R1-374/**', '.github/workflows/verification374.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Qualify independent methods
        run: |
          mkdir -p build/evidence374
          python3 tests/p3_r1_r374/wp17.py selftest | tee build/evidence374/SELFTEST.json
          python3 tests/p3_r1_r374/partition_selftest.py | tee build/evidence374/PARTITION-METHOD.json
          python3 tests/p3_r1_r374/static_control.py | tee build/evidence374/STATIC-CONTROL.json
          python3 tests/golden/model.py
      - uses: actions/checkout@v4
        with:
          repository: mmsanders/Digital-Tape
          ref: 3826018653e504217f37a16d8864fb0d597e22e6
          path: build/product374
          sparse-checkout: |
            engine
            hardware/characterisation
      - name: Reproduce the bounded rig-method counterexample
        run: |
          python3 build/product374/hardware/characterisation/test_media_atomicity.py
          python3 build/product374/hardware/characterisation/test_media_atomicity.py --mutate
          python3 tests/p3_r1_r374/rig_qualifier_probe.py build/product374/hardware/characterisation/media_atomicity.py > build/evidence374/RIG-PROBE.json
          cmp build/evidence374/RIG-PROBE.json findings/P3-R1-374/RIG-PROBE.json
      - name: Engine identity and actual port-tree drift control
        run: |
          python3 -B tests/p3_r1_r374/wp17.py enginecheck build/product374
          printf 'tree-drift control\n' > build/product374/engine/port/verification374-negative-control.txt
          if python3 -B tests/p3_r1_r374/wp17.py enginecheck build/product374; then exit 1; fi
          rm build/product374/engine/port/verification374-negative-control.txt
          python3 -B tests/p3_r1_r374/wp17.py enginecheck build/product374
      - name: Authenticate permanent raw assets and replay independently
        run: |
          python3 -B tests/p3_r1_r374/fetch_review.py build/retained374
          cmp build/retained374/SUMMARY.json findings/P3-R1-374/SUMMARY.json
          cp build/retained374/SUMMARY.json build/evidence374/SUMMARY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification374-independent-replay
          path: build/evidence374
          retention-days: 90
