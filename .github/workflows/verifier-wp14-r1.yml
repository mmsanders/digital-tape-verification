name: WP14 independent preflight
on:
  pull_request:
    paths: ['tests/wp16_shipping_exhaustion_r1/**', 'findings/P2-201-EXHAUSTION-2026-10-18/**', 'tests/wp14_r1/**', 'tests/wp16_ingest_r2/**', 'tests/wp16_ingest_stage1/**', 'findings/P2-R2-WP16-STAGE1-2026-10-15.md', 'findings/P2-R2-WP16-RETURN-2026-10-16/**', 'findings/P2-WP10-SUBSET-RETURN-2026-10-16/**', 'findings/P2-WP10-SUBSET-R2-2026-10-17/**', 'findings/P2-R1-WP14-A6-R4-2026-10-17/**', 'findings/P2-192-HOST-2026-10-17/**', 'tests/wp15_app1a_r1/**', 'findings/P2-APP1A-PREFLIGHT-2026-10-17/**', 'findings/P2-SUBSET-ROWS-2026-10-17/**', 'findings/P2-R2-WP16-SOWT-2026-10-15/**', 'tests/playback_readonly_r1/**', 'tests/playback_regression_epoch/**', 'findings/P2-R1-WP14-*.md', 'findings/P2-R2-WP16-ZERO-*.md', '.github/workflows/verifier-wp14-r1.yml']
  push:
    branches: [main]
    paths: ['tests/wp16_shipping_exhaustion_r1/**', 'findings/P2-201-EXHAUSTION-2026-10-18/**', 'tests/wp14_r1/**', 'tests/wp16_ingest_r2/**', 'tests/wp16_ingest_stage1/**', 'findings/P2-R2-WP16-STAGE1-2026-10-15.md', 'findings/P2-R2-WP16-RETURN-2026-10-16/**', 'findings/P2-WP10-SUBSET-RETURN-2026-10-16/**', 'findings/P2-WP10-SUBSET-R2-2026-10-17/**', 'findings/P2-R1-WP14-A6-R4-2026-10-17/**', 'findings/P2-192-HOST-2026-10-17/**', 'tests/wp15_app1a_r1/**', 'findings/P2-APP1A-PREFLIGHT-2026-10-17/**', 'findings/P2-SUBSET-ROWS-2026-10-17/**', 'findings/P2-R2-WP16-SOWT-2026-10-15/**', 'tests/playback_readonly_r1/**', 'tests/playback_regression_epoch/**', 'findings/P2-R1-WP14-*.md', 'findings/P2-R2-WP16-ZERO-*.md', '.github/workflows/verifier-wp14-r1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    name: WP14 oracle selftests (not Product acceptance)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: INGEST-1 independent authoring checkpoint (not importable)
        run: |
          python3 -m pip install -r tests/wp16_ingest_r2/requirements.txt
          python3 -B tests/wp16_ingest_r2/check_pins.py
          python3 -B tests/wp16_ingest_r2/selftest.py
          python3 -B tests/wp16_ingest_r2/zero_boundary_selftest.py
          python3 -B findings/P2-R2-WP16-SOWT-2026-10-15/reproduce.py
          python3 -B tests/wp16_ingest_r2/review.py --help
      - name: Publish and fetch immutable INGEST preflight2 sources
        if: github.repository_owner == 'mmsanders' && (github.head_ref == 'verification/169-preflight2' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/wp16_ingest_r2/publish.sh
      - name: INGEST-1 complete Stage1 selfchecks (not Product acceptance)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python3 -B tests/wp16_ingest_stage1/check_pins.py
          python3 -B tests/wp16_ingest_stage1/portability_selftest.py
          python3 -B tests/wp16_ingest_stage1/selftest.py
          python3 -B tests/wp16_ingest_stage1/completion_selftest.py
          python3 -B tests/wp16_ingest_stage1/zero_boundary_selftest.py
          python3 -B tests/wp16_ingest_stage1/large_selftest.py
          python3 -B tests/wp16_ingest_stage1/calibrate.py --out /tmp/ingest-calibration.json
          python3 -B tests/wp16_ingest_stage1/filter_bounds.py --out /tmp/ingest-filter-bounds.json
          python3 -B tests/wp16_ingest_stage1/review.py --help
          python3 -B tests/wp16_ingest_stage1/campaign.py --help
      - name: Publish and fetch complete INGEST-1 Stage1 sources
        if: github.repository_owner == 'mmsanders' && (startsWith(github.head_ref, 'verification/169-') || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/wp16_ingest_stage1/publish.sh
      - name: Reproduce exact-head APP-1A return findings (not Product acceptance)
        if: github.head_ref == 'verification/196-software-return'
        run: python3 -B findings/P2-APP1A-PREFLIGHT-2026-10-17/return-2/reproduce.py --out /tmp/app1a-return-results
      - uses: actions/upload-artifact@v4
        if: always() && github.head_ref == 'verification/196-software-return'
        with:
          name: verification196-exact-head-results
          path: /tmp/app1a-return-results
          retention-days: 90
      - name: Shipping exhaustion oracle controls (not Product acceptance)
        run: python3 -B tests/wp16_shipping_exhaustion_r1/selftest.py
      - name: APP-1A independent authoring selfchecks (not Product acceptance)
        run: python3 -B tests/wp15_app1a_r1/selftest.py
      - name: READ-1 independent publication (not Product acceptance)
        run: |
          python3 -B tests/playback_readonly_r1/check_pins.py
          python3 -B tests/playback_readonly_r1/selftest.py
          python3 -B tests/playback_readonly_r1/cases.py
          python3 -B tests/playback_readonly_r1/runner.py --help
          python3 -B tests/playback_readonly_r1/controls.py --help
          python3 -B tests/playback_readonly_r1/qualification.py --help
          python3 -B tests/playback_readonly_r1/absence.py --help
      - name: READOPT epoch checker controls (not Product acceptance)
        run: python3 -B tests/playback_regression_epoch/selftest.py
      - name: Publish and fetch immutable READOPT evidence
        if: github.repository == 'mmsanders/digital-tape-verification' && (github.head_ref == 'verification/146-readopt-epoch' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/playback_regression_epoch/publish.sh
      - run: python3 tests/wp14_r1/check_pins.py
      - run: python3 tests/wp14_r1/selftest.py
      - run: python3 tests/wp14_r1/amendment_selftest.py
      - run: python3 tests/wp14_r1/completion_selftest.py
      - run: python3 tests/wp14_r1/catalog.py
      - run: python3 tests/wp14_r1/runner.py --help
      - run: python3 tests/wp14_r1/native.py --help
      - run: python3 tests/wp14_r1/a8_identity.py --help
      - run: python3 tests/wp14_r1/qualification.py --help
      - name: Actual Windows off-card export rejection (not native acceptance)
        run: python3 -B findings/P2-R1-WP14-WIN-REHEARSAL-2026-10-15-evidence/replay.py

  shipping-exhaustion-baseline:
    name: Actual Windows shipping red control (not Product acceptance)
    if: github.head_ref == 'verification/201-shipping-exhaustion'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        id: original-kit
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          repository: mmsanders/Digital-Tape
          run-id: 38948012087
          artifact-ids: 12067900169
          path: baseline-kit
          merge-multiple: true
      - name: Authenticated public transport fallback
        if: steps.original-kit.outcome == 'failure'
        run: python -B tests/wp16_shipping_exhaustion_r1/fetch_small_baseline.py
      - name: Actual shipping baseline and causal adjacent controls
        run: python -B tests/wp16_shipping_exhaustion_r1/ci_baseline.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification201-shipping-baseline
          path: shipping-exhaustion-results
          retention-days: 90
