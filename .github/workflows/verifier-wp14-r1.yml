  contents: read
jobs:
  preflight:
    name: WP14 oracle selftests (not Product acceptance)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate255 actual phase stop (no native execution)
        run: |
          python3 -B findings/P2-255-STOP-2026-10-21/replay.py --out /tmp/verification255.json
          cmp /tmp/verification255.json findings/P2-255-STOP-2026-10-21/RESULT.json
      - name: Authenticate254 retained finite precision facts (no Product execution)
        run: |
          python3 -B findings/P2-254-RETURN-2026-10-21/replay.py --out /tmp/verification254.json
          cmp /tmp/verification254.json findings/P2-254-RETURN-2026-10-21/RESULT.json
      - name: Authenticate256 original preparation and source gaps (ZERO native execution)
        run: |
          python3 -B findings/P2-256-CORRECTION1-2026-10-21/replay.py --out /tmp/verification256-review.json
          cmp /tmp/verification256-review.json findings/P2-256-CORRECTION1-2026-10-21/RESULT.json
      - name: Authenticate253 exact source ledger and proof stop (no decoder run)
        run: |
          python3 -B findings/P2-253-RETURN-2026-10-21/replay.py --out /tmp/verification253-review.json
          cmp /tmp/verification253-review.json findings/P2-253-RETURN-2026-10-21/RESULT.json
      - name: Authenticate252 original recorder facts (no component execution)
        run: |
          python3 -B findings/P2-252-RETURN-2026-10-21/replay.py --out /tmp/verification252-review.json
          cmp /tmp/verification252-review.json findings/P2-252-RETURN-2026-10-21/RESULT.json
      - name: Observer256 offline kit readiness controls (ZERO native execution)
        run: |
          python3 -B tests/observer_kit_readiness_r1/selftest.py
          cd tests/observer_kit_readiness_r1
          sha256sum -c SHA256SUMS
      - name: Fault255 revised cost and coordinate controls (no fault execution)
        run: |
          python3 -B tests/fault_cost_r2/selftest.py
          cd tests/fault_cost_r2
          sha256sum -c SHA256SUMS
      - name: Meter254 finite coordinate/precision controls (no driver execution)
        run: |
          python3 -B tests/meter_precision_r1/selftest.py
          cd tests/meter_precision_r1
          sha256sum -c SHA256SUMS
      - name: Codec253 constructor premise controls (not source proof)
        run: |
          python3 -B tests/codec_cardinality_r1/selftest.py
          cd tests/codec_cardinality_r1
          sha256sum -c SHA256SUMS
      - name: Recorder252 independent method controls (not recorder acceptance)
        run: |
          python3 -B tests/evidence_recorder_r1/selftest.py
          cd tests/evidence_recorder_r1
          sha256sum -c SHA256SUMS
      - name: Authenticate241 two actual faults and original model (no Product run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/mmsanders/Digital-Tape/actions/artifacts/12325916869/zip > /tmp/verification241-original.zip
          python3 -B findings/P2-241-RETURN-2026-10-20/replay.py --artifact /tmp/verification241-original.zip --out /tmp/verification241-review.json
          cmp /tmp/verification241-review.json findings/P2-241-RETURN-2026-10-20/RESULT.json
      - name: Authenticate240 original finite shipping return (no Product run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/mmsanders/Digital-Tape/actions/artifacts/12324892347/zip > /tmp/verification240-original.zip
          python3 -B findings/P2-240-RETURN-2026-10-20/replay.py --artifact /tmp/verification240-original.zip --out /tmp/verification240-review.json
          cmp /tmp/verification240-review.json findings/P2-240-RETURN-2026-10-20/RESULT.json
      - name: Authenticate239 actual scalar and conditional-proof return
        env:
          GH_TOKEN: ${{ github.token }}
