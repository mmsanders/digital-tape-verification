          cmp /tmp/208-r2/source/RESULT.json findings/P2-208-R2-2026-10-19/SOURCE-RESULT.json
          cp /tmp/208-r2/source/RESULT.json /tmp/208-r2/SOURCE-RESULT.json
          cp /tmp/208-r2/source/fixture.c /tmp/208-r2/SOURCE-FIXTURE.c
          cd /tmp/208-r2
          sha256sum *.zip REPLAY.json SOURCE-RESULT.json SOURCE-FIXTURE.c > SHA256SUMS
          tag=evidence-208-r2-2026-10-19-38ca666
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_HEAD" --title "Verification208 correction return evidence" --notes "Exact five original Software artifacts; bounded source-extracted Linux query-failure control. S2 correction and S3 PM holds; no Product/native acceptance." *.zip REPLAY.json SOURCE-RESULT.json SOURCE-FIXTURE.c SHA256SUMS
