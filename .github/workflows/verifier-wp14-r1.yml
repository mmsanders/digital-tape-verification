          python3 -B findings/P2-239-RETURN-2026-10-20/replay.py --out /tmp/verification239-final
          cmp /tmp/verification239-final/REVIEW.json findings/P2-239-RETURN-2026-10-20/RESULT.json
      - name: Authenticate238 final pure parser/display component
        run: |
          python3 -B findings/P2-238-FINAL-2026-10-20/replay.py --out /tmp/verification238-final
          cmp /tmp/verification238-final/REVIEW.json findings/P2-238-FINAL-2026-10-20/RESULT.json
      - name: Authenticate242 carried identities (HOLD, no Product execution)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B findings/P2-242-INTEGRATION-2026-10-20/authenticate.py
      - name: Costed241 missing-fault plan and provenance controls (authoring only)
        run: |
          python3 -B tests/wp10_missing_faults_r1/selftest.py
          python3 -B tests/wp10_missing_faults_r1/reproduce.py --inputs /tmp/fault241-inputs
          cd tests/wp10_missing_faults_r1
          sha256sum -c SHA256SUMS
      - name: Publish and fetch241 immutable fault schedule
        if: github.head_ref == 'verification/241-fault-method'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash tests/wp10_missing_faults_r1/publish.sh
      - name: Fixed240 join-boundary source and reference controls (authoring only)
        run: |
          python3 -B tests/wp16_join_boundary_r1/selftest.py
          cd tests/wp16_join_boundary_r1
          sha256sum -c SHA256SUMS
      - name: Publish and fetch240 immutable boundary method
        if: github.head_ref == 'verification/240-join-method'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash tests/wp16_join_boundary_r1/publish.sh
      - name: Reproduce238 actual display finding (not acceptance)
        run: |
          python3 -B findings/P2-238-RETURN-2026-10-20/replay.py --out /tmp/verification238
          cmp /tmp/verification238/REVIEW.json findings/P2-238-RETURN-2026-10-20/RESULT.json
      - name: INTERNAL finite subproof challenge controls (authoring only)
        run: |
          python3 -B tests/wp16_internal_invariants_r1/selftest.py
          cd tests/wp16_internal_invariants_r1
          sha256sum -c SHA256SUMS
      - name: Publish and fetch239 immutable proof method
        if: github.head_ref == 'verification/239-internal-method'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash tests/wp16_internal_invariants_r1/publish.sh
      - name: INGEST-1 independent authoring checkpoint (not importable)
        run: |
          python3 -m pip install -r tests/wp16_ingest_r2/requirements.txt
          python3 -B tests/wp16_ingest_r2/check_pins.py
          python3 -B tests/wp16_ingest_r2/selftest.py
          python3 -B tests/wp16_ingest_r2/zero_boundary_selftest.py
          python3 -B findings/P2-R2-WP16-SOWT-2026-10-15/reproduce.py
          python3 -B tests/wp16_ingest_r2/review.py --help
      - name: Publish and fetch immutable INGEST preflight2 sources
        if: github.repository_owner == 'mmsanders' && (github.head_ref == 'verification/169-preflight2' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/wp16_ingest_r2/publish.sh
      - name: INGEST-1 complete Stage1 selfchecks (not Product acceptance)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python3 -B tests/wp16_ingest_stage1/check_pins.py
          python3 -B tests/wp16_ingest_stage1/portability_selftest.py
          python3 -B tests/wp16_ingest_stage1/selftest.py
          python3 -B tests/wp16_ingest_stage1/completion_selftest.py
          python3 -B tests/wp16_ingest_stage1/zero_boundary_selftest.py
          python3 -B tests/wp16_ingest_stage1/large_selftest.py
          python3 -B tests/wp16_ingest_stage1/calibrate.py --out /tmp/ingest-calibration.json
          python3 -B tests/wp16_ingest_stage1/filter_bounds.py --out /tmp/ingest-filter-bounds.json
          python3 -B tests/wp16_ingest_stage1/review.py --help
          python3 -B tests/wp16_ingest_stage1/campaign.py --help
      - name: Publish and fetch complete INGEST-1 Stage1 sources
        if: github.repository_owner == 'mmsanders' && (startsWith(github.head_ref, 'verification/169-') || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/wp16_ingest_stage1/publish.sh
      - name: Reproduce exact-head APP-1A return findings (not Product acceptance)
        if: github.head_ref == 'verification/196-software-return'
        run: python3 -B findings/P2-APP1A-PREFLIGHT-2026-10-17/return-2/reproduce.py --out /tmp/app1a-return-results
      - uses: actions/upload-artifact@v4
        if: always() && github.head_ref == 'verification/196-software-return'
        with:
          name: verification196-exact-head-results
          path: /tmp/app1a-return-results
          retention-days: 90
      - name: Authenticate retained Verification206 correction controls
        run: python3 -B findings/P2-206-READY-2026-10-18/fetch.py --out /tmp/verification206
      - name: Authenticate retained Verification204 failure receipts
        run: python3 -B findings/P2-204-KIT-2026-10-18/fetch.py --out /tmp/verification204
      - name: Authenticate and replay immutable shipping red evidence
        run: python3 -B findings/P2-201-EXHAUSTION-2026-10-18/fetch.py --out /tmp/verification201-retained.zip
      - name: Authenticate232 actual raw return and retain bounded disposition evidence
        if: github.head_ref == 'verification/232-disposition'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash findings/P2-232-RETURN-2026-10-20/publish.sh
      - name: Authenticate235 prerequisite-stop disposition (not native qualification)
        run: |
          python3 -B findings/P2-235-STOP-2026-10-20/replay.py --out /tmp/235-stop-result.json
          cmp /tmp/235-stop-result.json findings/P2-235-STOP-2026-10-20/RESULT.json
      - name: Six harmless observer capability method controls (authoring only)
        run: |
          python3 -B tests/wp16_observer_visibility_r1/selftest.py
          cd tests/wp16_observer_visibility_r1
          sha256sum -c SHA256SUMS
      - name: Publish and fetch235 immutable observer method
        if: github.head_ref == 'verification/235-observer-method'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash tests/wp16_observer_visibility_r1/publish.sh
      - name: Exact external shipping binding controls (authoring only)
        run: |
          python3 -B findings/P2-232-METHOD-2026-10-20/selftest.py
          python3 -B findings/P2-232-METHOD-2026-10-20/external.py --help
          cd findings/P2-232-METHOD-2026-10-20
          sha256sum -c SHA256SUMS
      - name: Shipping exhaustion oracle controls (not Product acceptance)
        run: python3 -B tests/wp16_shipping_exhaustion_r1/selftest.py
      - uses: actions/checkout@v4
        if: github.head_ref == 'verification/201-disposition'
        with:
          repository: mmsanders/Digital-Tape
          ref: ecca8c1304ba9511d78791e92ed35fac494f2a27
          path: candidate455
          persist-credentials: false
      - name: Independent replay and actual parser/static binding
        if: github.head_ref == 'verification/201-disposition'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/201-disposition/inputs
          python3 -B findings/P2-201-DISPOSITION-2026-10-18/replay.py --artifacts /tmp/201-disposition/inputs --out /tmp/201-disposition/REPLAY.json
          python3 -B findings/P2-201-DISPOSITION-2026-10-18/bindings.py --product candidate455 --out /tmp/201-disposition/binding
          python3 -B findings/P2-201-DISPOSITION-2026-10-18/fetch.py --out /tmp/201-retained
      - name: Retain independently authenticated disposition evidence
        if: github.head_ref == 'verification/201-disposition'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -c "import shutil;shutil.make_archive('/tmp/verification201-disposition','zip','/tmp/201-disposition')"
          cd /tmp
          sha256sum verification201-disposition.zip > verification201-disposition.SHA256SUMS
          gh release create "evidence-201-disposition-$SOURCE_HEAD-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_HEAD" --title "Verification201 corrected-head disposition observations" --notes "Actual parser binding, independent raw replay, all authenticated returned input ZIPs. No full package acceptance." verification201-disposition.zip verification201-disposition.SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always() && github.head_ref == 'verification/201-disposition'
        with:
          name: verification201-disposition
          path: /tmp/201-disposition
          retention-days: 90
      - name: Independently replay and retain exact208/209 returned receipts
        if: github.head_ref == 'verification/208-209-disposition'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p /tmp/208-209
          python3 -B findings/P2-208-209-RETURNS-2026-10-19/replay.py --artifacts /tmp/208-209 --out /tmp/208-209/REPLAY.json
          cmp /tmp/208-209/REPLAY.json findings/P2-208-209-RETURNS-2026-10-19/REPLAY.json
          cd /tmp/208-209
