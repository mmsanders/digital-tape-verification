name: WP14 independent preflight
on:
  pull_request:
    paths: ['tests/wp15_report_faults_r1/**', 'findings/P2-209-AUTHORING-2026-10-19/**', 'tests/wp15_cards_make_r1/**', 'findings/P2-208-AUTHORING-2026-10-19/**', 'findings/P2-206-READY-2026-10-18/**', 'findings/P2-204-KIT-2026-10-18/**', 'findings/P2-201-DISPOSITION-2026-10-18/**', 'tests/wp16_shipping_exhaustion_r1/**', 'findings/P2-201-EXHAUSTION-2026-10-18/**', 'tests/wp14_r1/**', 'tests/wp16_ingest_r2/**', 'tests/wp16_ingest_stage1/**', 'findings/P2-R2-WP16-STAGE1-2026-10-15.md', 'findings/P2-R2-WP16-RETURN-2026-10-16/**', 'findings/P2-WP10-SUBSET-RETURN-2026-10-16/**', 'findings/P2-WP10-SUBSET-R2-2026-10-17/**', 'findings/P2-R1-WP14-A6-R4-2026-10-17/**', 'findings/P2-192-HOST-2026-10-17/**', 'tests/wp15_app1a_r1/**', 'findings/P2-APP1A-PREFLIGHT-2026-10-17/**', 'findings/P2-SUBSET-ROWS-2026-10-17/**', 'findings/P2-R2-WP16-SOWT-2026-10-15/**', 'tests/playback_readonly_r1/**', 'tests/playback_regression_epoch/**', 'findings/P2-R1-WP14-*.md', 'findings/P2-R2-WP16-ZERO-*.md', '.github/workflows/verifier-wp14-r1.yml']
  push:
    branches: [main]
    paths: ['tests/wp15_report_faults_r1/**', 'findings/P2-209-AUTHORING-2026-10-19/**', 'tests/wp15_cards_make_r1/**', 'findings/P2-208-AUTHORING-2026-10-19/**', 'findings/P2-206-READY-2026-10-18/**', 'findings/P2-204-KIT-2026-10-18/**', 'findings/P2-201-DISPOSITION-2026-10-18/**', 'tests/wp16_shipping_exhaustion_r1/**', 'findings/P2-201-EXHAUSTION-2026-10-18/**', 'tests/wp14_r1/**', 'tests/wp16_ingest_r2/**', 'tests/wp16_ingest_stage1/**', 'findings/P2-R2-WP16-STAGE1-2026-10-15.md', 'findings/P2-R2-WP16-RETURN-2026-10-16/**', 'findings/P2-WP10-SUBSET-RETURN-2026-10-16/**', 'findings/P2-WP10-SUBSET-R2-2026-10-17/**', 'findings/P2-R1-WP14-A6-R4-2026-10-17/**', 'findings/P2-192-HOST-2026-10-17/**', 'tests/wp15_app1a_r1/**', 'findings/P2-APP1A-PREFLIGHT-2026-10-17/**', 'findings/P2-SUBSET-ROWS-2026-10-17/**', 'findings/P2-R2-WP16-SOWT-2026-10-15/**', 'tests/playback_readonly_r1/**', 'tests/playback_regression_epoch/**', 'findings/P2-R1-WP14-*.md', 'findings/P2-R2-WP16-ZERO-*.md', '.github/workflows/verifier-wp14-r1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    name: WP14 oracle selftests (not Product acceptance)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: INGEST-1 independent authoring checkpoint (not importable)
        run: |
          python3 -m pip install -r tests/wp16_ingest_r2/requirements.txt
          python3 -B tests/wp16_ingest_r2/check_pins.py
          python3 -B tests/wp16_ingest_r2/selftest.py
          python3 -B tests/wp16_ingest_r2/zero_boundary_selftest.py
          python3 -B findings/P2-R2-WP16-SOWT-2026-10-15/reproduce.py
          python3 -B tests/wp16_ingest_r2/review.py --help
      - name: Publish and fetch immutable INGEST preflight2 sources
        if: github.repository_owner == 'mmsanders' && (github.head_ref == 'verification/169-preflight2' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/wp16_ingest_r2/publish.sh
      - name: INGEST-1 complete Stage1 selfchecks (not Product acceptance)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python3 -B tests/wp16_ingest_stage1/check_pins.py
          python3 -B tests/wp16_ingest_stage1/portability_selftest.py
          python3 -B tests/wp16_ingest_stage1/selftest.py
          python3 -B tests/wp16_ingest_stage1/completion_selftest.py
          python3 -B tests/wp16_ingest_stage1/zero_boundary_selftest.py
          python3 -B tests/wp16_ingest_stage1/large_selftest.py
          python3 -B tests/wp16_ingest_stage1/calibrate.py --out /tmp/ingest-calibration.json
          python3 -B tests/wp16_ingest_stage1/filter_bounds.py --out /tmp/ingest-filter-bounds.json
          python3 -B tests/wp16_ingest_stage1/review.py --help
          python3 -B tests/wp16_ingest_stage1/campaign.py --help
      - name: Publish and fetch complete INGEST-1 Stage1 sources
        if: github.repository_owner == 'mmsanders' && (startsWith(github.head_ref, 'verification/169-') || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/wp16_ingest_stage1/publish.sh
      - name: Reproduce exact-head APP-1A return findings (not Product acceptance)
        if: github.head_ref == 'verification/196-software-return'
        run: python3 -B findings/P2-APP1A-PREFLIGHT-2026-10-17/return-2/reproduce.py --out /tmp/app1a-return-results
      - uses: actions/upload-artifact@v4
        if: always() && github.head_ref == 'verification/196-software-return'
        with:
          name: verification196-exact-head-results
          path: /tmp/app1a-return-results
          retention-days: 90
      - name: Authenticate retained Verification206 correction controls
        run: python3 -B findings/P2-206-READY-2026-10-18/fetch.py --out /tmp/verification206
      - name: Authenticate retained Verification204 failure receipts
        run: python3 -B findings/P2-204-KIT-2026-10-18/fetch.py --out /tmp/verification204
      - name: Authenticate and replay immutable shipping red evidence
        run: python3 -B findings/P2-201-EXHAUSTION-2026-10-18/fetch.py --out /tmp/verification201-retained.zip
      - name: Shipping exhaustion oracle controls (not Product acceptance)
        run: python3 -B tests/wp16_shipping_exhaustion_r1/selftest.py
      - uses: actions/checkout@v4
        if: github.head_ref == 'verification/201-disposition'
        with:
          repository: mmsanders/Digital-Tape
          ref: ecca8c1304ba9511d78791e92ed35fac494f2a27
          path: candidate455
          persist-credentials: false
      - name: Independent replay and actual parser/static binding
        if: github.head_ref == 'verification/201-disposition'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/201-disposition/inputs
          python3 -B findings/P2-201-DISPOSITION-2026-10-18/replay.py --artifacts /tmp/201-disposition/inputs --out /tmp/201-disposition/REPLAY.json
          python3 -B findings/P2-201-DISPOSITION-2026-10-18/bindings.py --product candidate455 --out /tmp/201-disposition/binding
          python3 -B findings/P2-201-DISPOSITION-2026-10-18/fetch.py --out /tmp/201-retained
      - name: Retain independently authenticated disposition evidence
        if: github.head_ref == 'verification/201-disposition'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -c "import shutil;shutil.make_archive('/tmp/verification201-disposition','zip','/tmp/201-disposition')"
          cd /tmp
          sha256sum verification201-disposition.zip > verification201-disposition.SHA256SUMS
          gh release create "evidence-201-disposition-$SOURCE_HEAD-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_HEAD" --title "Verification201 corrected-head disposition observations" --notes "Actual parser binding, independent raw replay, all authenticated returned input ZIPs. No full package acceptance." verification201-disposition.zip verification201-disposition.SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always() && github.head_ref == 'verification/201-disposition'
        with:
          name: verification201-disposition
          path: /tmp/201-disposition
          retention-days: 90
      - name: APP-1A precise report-fault independent controls (not acceptance)
        run: python3 -B tests/wp15_report_faults_r1/selftest.py
      - name: Publish compact209 report-fault transport
        if: github.head_ref == 'verification/209-report-authoring'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -B findings/P2-209-AUTHORING-2026-10-19/publish.py
          tag="package-209-$SOURCE_HEAD"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_HEAD" --title "Verification209 report fault authoring" --notes "Independent report-fault/ID contract. Actual platform fault returns still pending." /tmp/publication209/wp15-report-faults-r1.zip /tmp/publication209/PROVENANCE.json /tmp/publication209/SHA256SUMS
          fi
      - name: APP-1A S2/S3 independent contract controls (not acceptance)
        run: python3 -B tests/wp15_cards_make_r1/selftest.py
      - name: Publish compact authenticated208 import transport
        if: github.head_ref == 'verification/208-host-authoring'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -B findings/P2-208-AUTHORING-2026-10-19/publish.py
          tag="package-208-$SOURCE_HEAD"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir /tmp/existing208
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir /tmp/existing208
            cmp /tmp/existing208/wp15-cards-make-r1.zip /tmp/publication208/wp15-cards-make-r1.zip
            cmp /tmp/existing208/PROVENANCE.json /tmp/publication208/PROVENANCE.json
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_HEAD" --title "Verification208 S2/S3 authored package" --notes "Exact independent import bytes and provenance; Stage2 actual candidate dispositions pending." /tmp/publication208/wp15-cards-make-r1.zip /tmp/publication208/PROVENANCE.json /tmp/publication208/SHA256SUMS
          fi
      - name: APP-1A independent authoring selfchecks (not Product acceptance)
        run: python3 -B tests/wp15_app1a_r1/selftest.py
      - name: READ-1 independent publication (not Product acceptance)
        run: |
          python3 -B tests/playback_readonly_r1/check_pins.py
          python3 -B tests/playback_readonly_r1/selftest.py
          python3 -B tests/playback_readonly_r1/cases.py
          python3 -B tests/playback_readonly_r1/runner.py --help
          python3 -B tests/playback_readonly_r1/controls.py --help
          python3 -B tests/playback_readonly_r1/qualification.py --help
          python3 -B tests/playback_readonly_r1/absence.py --help
      - name: READOPT epoch checker controls (not Product acceptance)
        run: python3 -B tests/playback_regression_epoch/selftest.py
      - name: Publish and fetch immutable READOPT evidence
        if: github.repository == 'mmsanders/digital-tape-verification' && (github.head_ref == 'verification/146-readopt-epoch' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/playback_regression_epoch/publish.sh
      - run: python3 tests/wp14_r1/check_pins.py
      - run: python3 tests/wp14_r1/selftest.py
      - run: python3 tests/wp14_r1/amendment_selftest.py
      - run: python3 tests/wp14_r1/completion_selftest.py
      - run: python3 tests/wp14_r1/catalog.py
      - run: python3 tests/wp14_r1/runner.py --help
      - run: python3 tests/wp14_r1/native.py --help
      - run: python3 tests/wp14_r1/a8_identity.py --help
      - run: python3 tests/wp14_r1/qualification.py --help
      - name: Actual Windows off-card export rejection (not native acceptance)
        run: python3 -B findings/P2-R1-WP14-WIN-REHEARSAL-2026-10-15-evidence/replay.py

  shipping-exhaustion-baseline:
    name: Actual Windows shipping red control (not Product acceptance)
    if: github.head_ref == 'verification/201-shipping-exhaustion'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        id: original-kit
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          repository: mmsanders/Digital-Tape
          run-id: 38948012087
          artifact-ids: 12067900169
          path: baseline-kit
          merge-multiple: true
      - name: Authenticated public transport fallback
        if: steps.original-kit.outcome == 'failure'
        run: python -B tests/wp16_shipping_exhaustion_r1/fetch_small_baseline.py
      - name: Actual shipping baseline and causal adjacent controls
        run: python -B tests/wp16_shipping_exhaustion_r1/ci_baseline.py
      - name: Retain immutable raw baseline as a release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python -c "import shutil;shutil.make_archive('verification201-shipping-baseline','zip','shipping-exhaustion-results')"
          sha256sum verification201-shipping-baseline.zip > verification201-shipping-baseline.SHA256SUMS
          tag="evidence-verification201-$SOURCE_HEAD-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_HEAD" --title "Verification201 original shipping red baseline" --notes "Raw actual-shipping baseline; contract remains RED. Publication source $SOURCE_HEAD; run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT. Not Product acceptance." verification201-shipping-baseline.zip verification201-shipping-baseline.SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification201-shipping-baseline
          path: shipping-exhaustion-results
          retention-days: 90

  shipping-correction:
    name: Independent corrected shipping exhaustion (Server only)
    if: github.head_ref == 'verification/201-disposition'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mmsanders/Digital-Tape
          ref: 50bc4160f6da527da8c684d05264f99815aaa870
          path: candidate459
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actual shipping configuration and unchanged independent regression
        run: python -B findings/P2-201-DISPOSITION-2026-10-18/shipping.py
      - name: Retain raw shipping execution and exact rebuilt executable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python -c "import shutil;shutil.make_archive('verification201-candidate','zip','candidate-results')"
          sha256sum verification201-candidate.zip > verification201-candidate.SHA256SUMS
          gh release create "evidence-201-candidate-$SOURCE_HEAD-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_HEAD" --title "Verification201 corrected shipping executable and observations" --notes "Independent shipping build of Product50bc416, native Windows Server memory-limit execution. No Windows11/full package claim." verification201-candidate.zip verification201-candidate.SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification201-corrected-shipping
          path: candidate-results
          retention-days: 90

  kit204-tail:
    name: Exact summary failure control (not Product acceptance)
    if: github.head_ref == 'verification/204-kit-review'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actual pinned summary and exact PowerShell tail
        run: python -B findings/P2-204-KIT-2026-10-18/reproduce.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: mmsanders/Digital-Tape
          run-id: 39104751447
          artifact-ids: 12128173724
          path: verification204-rehearsal
          merge-multiple: true
      - name: Authenticate retained raw rehearsal
        shell: python
        run: |
          import hashlib,pathlib
          p=pathlib.Path('verification204-rehearsal/ingest-win11-packet-50bc4160f6da.zip')
          assert p.stat().st_size == 212596344
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'cc51a76875c6564fee90801c2119f1f1750b3ddcc7193d53d94d59dd86ee7de9'
      - name: Retain raw rehearsal and causal failure receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python -c "import shutil;shutil.make_archive('verification204-controls','zip','verification204-results')"
          sha256sum verification204-controls.zip verification204-rehearsal/ingest-win11-packet-50bc4160f6da.zip > verification204.SHA256SUMS
          gh release create "evidence-204-$SOURCE_HEAD-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_HEAD" --title "Verification204 kit correction receipts" --notes "Exact pinned script tail and summarizer causal controls, original Software461 Server rehearsal. RED readiness; no Windows11 or Product acceptance." verification204-controls.zip verification204-rehearsal/ingest-win11-packet-50bc4160f6da.zip verification204.SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification204-controls
          path: verification204-results
          retention-days: 90

  kit206-correction:
    name: Independent corrected summary exit controls (Server mechanics)
    if: github.head_ref == 'verification/206-transport-readiness'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact original and corrected tails, actual summarizer, eight controls
        run: python -B findings/P2-206-READY-2026-10-18/reproduce.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: mmsanders/Digital-Tape
          run-id: 39138302218
          artifact-ids: 12141536738
          path: verification206-rehearsal
          merge-multiple: true
      - name: Authenticate original corrected rehearsal bytes
        shell: python
        run: |
          import hashlib,pathlib
          p=pathlib.Path('verification206-rehearsal/ingest-win11-packet-50bc4160f6da.zip')
          assert p.stat().st_size==212991256
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='9485590db66f953d9bb22290accb2d0ea332d5c6fd80827c1f4cc4117dc1bb30'
      - name: Retain independent controls and original returned rehearsal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python -c "import shutil;shutil.make_archive('verification206-controls','zip','verification206-results')"
          sha256sum verification206-controls.zip verification206-rehearsal/ingest-win11-packet-50bc4160f6da.zip verification206-rehearsal/summary-controls.json > verification206.SHA256SUMS
          gh release create "evidence-206-$SOURCE_HEAD-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_HEAD" --title "Verification206 transport correction controls" --notes "Independent exact-tail controls and original returned Software461 Server mechanics rehearsal. No Windows11 or Product acceptance." verification206-controls.zip verification206-rehearsal/ingest-win11-packet-50bc4160f6da.zip verification206-rehearsal/summary-controls.json verification206.SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification206-controls
          path: verification206-results
          retention-days: 90

  report209-id-witnesses:
    name: Actual narrow S1 closed-ID neighbours (Linux shipping build)
    if: github.head_ref == 'verification/209-report-authoring'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mmsanders/Digital-Tape
          ref: b9f430c8c9b33532abf07eea0ed2653310639f2d
          path: candidate-s1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact shipping build, no observation/test flags
        working-directory: candidate-s1/host/ingest
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          cargo build --release --locked
      - name: Four contract-based actual ID witnesses and valid neighbours
        run: python3 -B tests/wp15_report_faults_r1/run_ids.py --binary candidate-s1/host/ingest/target/release/ingest --out /tmp/verification209-ids
      - name: Retain exact rebuilt bytes and raw actual observations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -c "import shutil;shutil.make_archive('/tmp/verification209-ids','zip','/tmp/verification209-ids')"
          cd /tmp
          sha256sum verification209-ids.zip > verification209-ids.SHA256SUMS
          gh release create "evidence-209-ids-$SOURCE_HEAD-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_HEAD" --title "Verification209 actual shipping ID witnesses" --notes "Four narrow host commands; rebuilt b9f430c bytes, no native/full acceptance or Michael kit substitution." verification209-ids.zip verification209-ids.SHA256SUMS
