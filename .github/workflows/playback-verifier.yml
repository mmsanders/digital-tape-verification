name: Verification playback selftest
on:
  push:
    paths:
      - 'tests/playback_draft8/**'
      - 'tests/Makefile'
      - '.github/workflows/playback-verifier.yml'
  workflow_dispatch:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run independent playback package selftest
        run: python3 tests/playback_draft8/selftest.py
