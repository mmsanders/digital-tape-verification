name: Verification package selftests

on:
  pull_request:
    paths:
      - 'tests/*_draft8/**'
      - 'tests/*_draft9/**'
      - 'tests/*_r44/**'
      - 'tests/*.[ch]'
      - 'tests/Makefile'
      - '.github/workflows/verifier-package-selftests.yml'
  push:
    branches: [main]
    paths:
      - 'tests/*_draft8/**'
      - 'tests/*_draft9/**'
      - 'tests/*_r44/**'
      - 'tests/*.[ch]'
      - 'tests/Makefile'
      - '.github/workflows/verifier-package-selftests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-selftests:
    name: verifier package selftests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          python3 --version
          cc --version | head -1
          make --version | head -1

      - run: make -C tests check-infrastructure

      - name: Run draft8, draft9 and R44 package self-tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(tests/*_draft8 tests/*_draft9 tests/*_r44)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::No draft8, draft9 or R44 verifier packages found"
            exit 1
          fi

          for package in "${packages[@]}"; do
            echo "::group::${package}"
            if [ -f "${package}/selftest.py" ]; then
              python3 "${package}/selftest.py"
            elif [ -f "${package}/Makefile" ] && grep -Eq '^[[:space:]]*check[[:space:]]*:' "${package}/Makefile"; then
              make -C "${package}" check
            else
              echo "::error file=${package}::Verifier package has no selftest.py or Makefile check target"
              exit 1
            fi
            echo "::endgroup::"
          done
